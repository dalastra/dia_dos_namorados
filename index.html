<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dia dos Namorados</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="container">

        <!-- LADO ESQUERDO -->
        <section class="left">

            <img
                src="assets/fundologin.png"
                alt="Fundo login"
                class="fundo-login">

            <img
                src="assets/felizdiadosnamorados.png"
                alt="Feliz dia dos namorados"
                class="titulo">

            <div class="polaroids">

                <img src="assets/fotoesquerdapolaroid.png" class="foto foto1">

                <img src="assets/fotodireitapolaroid.png" class="foto foto2">

                <img src="assets/fotocentropolaroid.png" class="foto foto3">

            </div>

        </section>

        <!-- LADO DIREITO -->
        <section class="right">

            <img
                src="assets/folhadireita.png"
                class="folha folha-top">

            <img
                src="assets/folhaesquerda.png"
                class="folha folha-bottom">

            <div class="login-card">

                <img
                    src="assets/euteamo.png"
                    alt="Eu te amo"
                    class="logo-amor">

                <form id="formLogin">

                    <label>
                        Filme preferido:
                    </label>

                    <input
                        type="text"
                        id="filme"
                        placeholder="Digite o nome do seu filme preferido..."
                    >

                    <label>
                        Senha:
                    </label>

                    <input
                        type="text"
                        id="senha"
                        placeholder="Digite a data do pedido de namoro..."
                    >

                    <button type="submit">
                        Acabar com a ansiedade
                    </button>

                </form>

            </div>

        </section>

    </main>

    <script src="js/script.js"></script>

</body>
</html>
